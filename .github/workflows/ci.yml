name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (basic)
        run: node --check src/**/*.mjs

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npx c8 --reporter=text --reporter=lcov npm test

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t squidweave:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name test -p 4010:4010 \
            -e DRY_RUN=true \
            -e PORT=4010 \
            squidweave:${{ github.sha }}
          sleep 5
          curl -sf http://localhost:4010/health | grep -q '"ok":true'
          docker stop test
