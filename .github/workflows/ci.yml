name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint (basic)
        run: find src -name '*.mjs' -print0 | xargs -0 node --check

      - name: Run tests with coverage
        run: npx c8 --reporter=text --reporter=lcov npm test

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t squidweave:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name test -p 4010:4010 \
            -e DRY_RUN=true \
            -e PORT=4010 \
            squidweave:${{ github.sha }}
          timeout 60 bash -c 'until curl -sf http://localhost:4010/health | grep -q '"'"'"ok":true'"'"'; do sleep 2; done'
          docker stop test
