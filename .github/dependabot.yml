version: 2
updates:
  # Keep npm dependencies (root + ui) patched. Dependabot opens PRs for
  # security and version updates; on merge it re-scans and auto-closes
  # resolved alerts.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security

  # GitHub Actions supply chain.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - security
